name: Build Linux Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    # This runs the build inside an older Linux container with older GLIBC libraries
    container:
      image: python:3.11-bullseye

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Tkinter Linux Dependencies
      run: |
        apt-get update
        apt-get install -y python3-tk

    - name: Install Python Libraries
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller numpy matplotlib pillow

   - name: Build with PyInstaller
      run: pyinstaller --onefile --windowed --hidden-import PIL._tkinter_finder hamosv2.py

    - name: Upload the Executable
      uses: actions/upload-artifact@v4
      with:
        name: hamosv2-linux-executable
        path: dist/*
